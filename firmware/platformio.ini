; ESP32 WROOM-32 (KEYESTUDIO, 4 MB flash, no PSRAM) - headless filament scale.
; The phone is the display: Android app (../android) or the built-in web page.
; Pin map: ../docs/WROOM32_PORT.md

[platformio]
default_envs = esp32dev_hsu

[env:esp32dev_hsu]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
; The OTA password comes from firmware/.ota_password (generated on the first build, git-ignored).
extra_scripts = pre:scripts/ota_password.py
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
  -Os
  ; AsyncTCP defaults to a 16 KB stack. Our handlers are tiny; the heap is needed for TLS.
  -DCONFIG_ASYNC_TCP_STACK_SIZE=7168
  -DFW_VERSION=\"0.3.0\"
lib_deps =
  mathieucarbou/ESPAsyncWebServer @ ^3.6.0
  mathieucarbou/AsyncTCP @ ^3.3.0
  bogde/HX711 @ ^0.7.5
  adafruit/Adafruit PN532 @ ^1.3.3
  adafruit/Adafruit BusIO @ ^1.16.1
  bblanchon/ArduinoJson @ ^6.21.5
  h2zero/NimBLE-Arduino @ ^2.3.0

; Same firmware, uploaded over Wi-Fi instead of USB:
;   pio run -e esp32dev_hsu_ota -t upload --upload-port <scale-ip>
; The scale must already run a build with the two-slot partition table (one USB flash switches it).
[env:esp32dev_hsu_ota]
extends = env:esp32dev_hsu
upload_protocol = espota

; Same firmware plus a byte-level trace of every frame exchanged with the PN532.
[env:esp32dev_hsu_debug]
extends = env:esp32dev_hsu
build_flags =
  ${env:esp32dev_hsu.build_flags}
  -DPN532DEBUG
