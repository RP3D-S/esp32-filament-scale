; ESP32 WROOM-32 (KEYESTUDIO, 4 MB flash, no PSRAM) - headless filament scale.
; The phone is the display: Android app (../android) or the built-in web page.
; Pin map: ../docs/WROOM32_PORT.md

[platformio]
default_envs = esp32dev_hsu

[env:esp32dev_hsu]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
  -Os
  -DFW_VERSION=\"0.1.0\"
lib_deps =
  mathieucarbou/ESPAsyncWebServer @ ^3.6.0
  mathieucarbou/AsyncTCP @ ^3.3.0
  bogde/HX711 @ ^0.7.5
  adafruit/Adafruit PN532 @ ^1.3.3
  adafruit/Adafruit BusIO @ ^1.16.1
  bblanchon/ArduinoJson @ ^6.21.5
  h2zero/NimBLE-Arduino @ ^2.3.0
